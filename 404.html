<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botly — الصفحة غير موجودة</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --ink:#0B0F1A; --gold:#E8A838; --teal:#1EC8C8; --muted:#8A95B0; --card:#141829; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif; background: var(--ink); color: #F5F7FF;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 24px; direction: rtl;
}
body::before {
  content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(232,168,56,0.08) 0%, transparent 65%);
  pointer-events: none;
}
.code {
  font-size: 8rem; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, var(--gold), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 8px;
}
.bot-icon {
  font-size: 4rem; margin-bottom: 20px; display: block;
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
p { color: var(--muted); font-size: 1rem; line-height: 1.7; max-width: 400px; margin-bottom: 32px; }
.btn-home {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--gold); color: var(--ink); padding: 13px 28px;
  border-radius: 50px; font-weight: 700; font-size: 0.95rem;
  text-decoration: none; transition: all .25s; margin-left: 10px;
}
.btn-home:hover { background: #F5C96A; transform: translateY(-2px); }
.btn-bot {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1.5px solid rgba(30,200,200,0.35); color: var(--teal);
  padding: 13px 28px; border-radius: 50px; font-weight: 600;
  font-size: 0.95rem; text-decoration: none; transition: all .25s;
}
.btn-bot:hover { background: rgba(30,200,200,0.08); }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <span class="bot-icon">🤖</span>
  <div class="code">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>يبدو أن البوت أكل هذه الصفحة! الرابط الذي تبحث عنه غير موجود أو تم نقله.</p>
  <div class="btns">
    <a href="/botly-website/" class="btn-home">← العودة للرئيسية</a>
    <a href="https://t.me/botlyapp_bot" class="btn-bot">✈️ تحدث مع البوت</a>
  </div>
</body>
</html>
